<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic-Tac-Toe</title>
    <link href="style.css" rel="stylesheet" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="container">
      <div class="game-info">
        <div class="player-marker">
          <h3>Symbol :</h3>
          <img id="red-cross" src="../assets/cross.svg" alt="red-cross" />
        </div>

        <div class="player-marker">
          <h3>Symbol :</h3>
          <img id="blue-circle" src="../assets/circle.svg" alt="blue-circle" />
        </div>

        <div>
          <label for="player-one">Player One : </label>
          <input type="text" id="player-one" placeholder="Player One" />
        </div>

        <div>
          <label for="player-two">Player Two : </label>
          <input type="text" id="player-two" placeholder="Player Two" />
        </div>

        <button id="start-game">Start</button>
        <button id="restart-game">Restart</button>
      </div>

      <div class="board">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
      </div>

      <div class="result"></div>
    </div>
  </body>
</html>
